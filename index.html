<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>what's profiling</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Hero Image -->
        <img src="images/01_hero.png" alt="こんなにたくさん 自分のことがわかる!" class="lp-image">

        <!-- Section 2 -->
        <img src="images/02_section.png" alt="プロファイリングとは" class="lp-image">

        <!-- Section 3 -->
        <img src="images/03_section.png" alt="プロファイリングの特徴" class="lp-image">

        <!-- Section 4 -->
        <img src="images/04_section.png" alt="セッション内容" class="lp-image">

        <!-- Section 5 -->
        <img src="images/05_section.png" alt="お客様の声" class="lp-image">

        <!-- Section 6 -->
        <img src="images/06_section.png" alt="セッションの流れ" class="lp-image">

        <!-- Section 7 -->
        <img src="images/07_section.png" alt="プロファイリングの効果" class="lp-image">

        <!-- Section 8 -->
        <img src="images/08_section.png" alt="セッション詳細" class="lp-image">

        <!-- Section 9: 変わることもございません -->
        <img src="images/09_section.png" alt="一生変わることのない自分だけの取扱説明書" class="lp-image">

        <!-- Section 10: 販売価格 -->
        <img src="images/10_price.png" alt="販売価格" class="lp-image">

        <!-- ※「申し込み方法」セクション（5-24.png）削除 -->
        <!-- ※ CTAボタン「申し込む」削除 -->
        <!-- ※「ABOUT ME」セクション（11-6.png）削除 -->

        <!-- Q&A Section -->
        <div class="qa-section">
            <div class="qa-header">
                <span class="qa-subtitle">よくあるご質問</span>
                <span class="qa-title">Q&amp;A</span>
            </div>

            <!-- Q&A 1 -->
            <div class="qa-item">
                <div class="qa-inner">
                    <div class="qa-row qa-question">
                        <div class="qa-badge">Q</div>
                        <div class="qa-text">誰でも受けられますか？</div>
                    </div>
                    <div class="qa-row qa-answer">
                        <div class="qa-badge">A</div>
                        <div class="qa-text">適正診断のようなチェックシートではないので、どなたでもシートを発行する事ができます。</div>
                    </div>
                    <hr class="qa-divider">
                </div>
            </div>

            <!-- Q&A 2 -->
            <div class="qa-item">
                <div class="qa-inner">
                    <div class="qa-row qa-question">
                        <div class="qa-badge">Q</div>
                        <div class="qa-text">子どもの血液型がわからないのですが調べないとシート発行できないですか？</div>
                    </div>
                    <div class="qa-row qa-answer">
                        <div class="qa-badge">A</div>
                        <div class="qa-text">父親と母親の血液型からの可能性ある血液型でシート発行させて頂きます。ZOOMセッションでお子様の特徴をお伺いしながら、お話進めていきます。</div>
                    </div>
                    <hr class="qa-divider">
                </div>
            </div>

            <!-- Q&A 3 -->
            <div class="qa-item">
                <div class="qa-inner">
                    <div class="qa-row qa-question">
                        <div class="qa-badge">Q</div>
                        <div class="qa-text">出生産院が現在ないのですが、大丈夫でしょうか？</div>
                    </div>
                    <div class="qa-row qa-answer">
                        <div class="qa-badge">A</div>
                        <div class="qa-text">生まれた場所の経度・緯度から発行していますので、住所の番地まで頂ければ大丈夫です。番地までわからない時は市まであれば、シート発行は可能です。</div>
                    </div>
                    <hr class="qa-divider">
                </div>
            </div>
        </div>

        <!-- ※ 最終CTAボタン「申し込む」削除 -->

    </div>
</body>

</html>
